[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "near-whisper"
version = "1.0.0"
description = "Free and open source GUI for local Whisper audio transcription"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "near-whisper contributors" },
]
keywords = ["whisper", "transcription", "audio", "gradio", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "openai-whisper==20250625",
    "gradio==6.8",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "scipy==1.16.3",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "tqdm==4.67.3",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
near-whisper = "app.gui:create_gui"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py38"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
